<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav><h1>TaskManager</h1><a href="dashboard.html">Dashboard</a><a href="tasks.html">Tasks</a><a href="users.html" class="active">Users</a></nav>

        <div class="card">
            <h3>Add New User</h3>

        <div class="card" style="margin-top:20px;">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Action</th></tr></thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/users.js"></script>
